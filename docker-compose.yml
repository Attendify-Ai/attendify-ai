services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: attendify
      POSTGRES_PASSWORD: attendify123
      POSTGRES_DB: attendify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://attendify:attendify123@db:5432/attendify
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Used by the user's browser, so it must be a host-reachable URL
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
